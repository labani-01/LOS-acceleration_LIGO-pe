[variable_params]
mchirp =
q =
spin1_a =
spin1_azimuthal =
spin1_polar =
spin2_a =
spin2_azimuthal =
spin2_polar =
inclination =
tc =
ra =
dec =
coa_phase =
polarization =
distance =
acc = 

[static_params]
base_model = IMRPhenomXO4a
trigger_time = 1249852257.0
approximant = constlosAcc
f_lower = 15
f_ref = 20
n = 0.1
v0 = 0
#acc = 0
#polarization = 0
taper = TAPER_NONE
tw = 0.08

[prior-mchirp]
name = mchirp_from_uniform_mass1_mass2
min-mchirp = 5
max-mchirp = 9

[prior-q]
name = q_from_uniform_mass1_mass2
min-q = 4
max-q = 20

[prior-distance]
#; following gives a uniform in volume
name = uniform_radius
min-distance = 10
max-distance = 450

[prior-tc]
#; coalescence time prior
name = uniform
min-tc = 1249852256.9
max-tc = 1249852257.1

[prior-spin1_a]
name = uniform
min-spin1_a = 0.0
max-spin1_a = 0.99

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = 0.0
max-spin2_a = 0.99

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

[waveform_transforms-spin1x+spin1y+spin1z]
name = spherical_to_cartesian
x = spin1x
y = spin1y
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x+spin2y+spin2z]
name = spherical_to_cartesian
x = spin2x
y = spin2y
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal

[waveform_transforms-mass1]
name = custom
inputs = mchirp, q
mass1 = mass1_from_mchirp_q(mchirp, q)

[waveform_transforms-mass2]
name = custom
inputs = mchirp, q
mass2 = mass2_from_mchirp_q(mchirp, q)

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle


[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[prior-coa_phase]
name = uniform_angle

[prior-acc]
name = uniform
min-acc = -0.008
max-acc = 0.008

[model]
name = marginalized_polarization
sample_rate = 4096
#this sample_rate value is important. if it is not provided then workflow run will show error. important.
low-frequency-cutoff = H1:20 L1:30 V1:20
ignore-failed-waveforms =
#high-frequency-cutoff = 1000.0

marginalize_vector_params = polarization
marginalize_vector_samples = 10000

marginalize_distance = True
marginalize_distance_param = distance
marginalize_distance_interpolator = True
marginalize_distance_snr_range = 5, 50
marginalize_distance_density = 100, 100
marginalize_distance_samples = 5000


[sampler]
name = dynesty
dlogz = 0.1
nlive = 8000
walks = 600
sample = rwalk
checkpoint_time_interval = 1800


[data]
psd-estimation = median-mean
psd-start-time = -256
psd-end-time = 100
psd-inverse-length = 8
psd-segment-length = 8
psd-segment-stride = 4
sample-rate = 4096
strain-high-pass = 15
pad-data = 8
trigger-time = 1249852257.0
analysis-start-time = -100
analysis-end-time = 14
instruments = H1 L1 V1
channel-name = H1:GWOSC-16KHZ_R1_STRAIN L1:GWOSC-16KHZ_R1_STRAIN V1:GWOSC-16KHZ_R1_STRAIN
frame-files = H1:/home/lroy02/acceleration_runs/separate_runs/GW190814/H-H1_GWOSC_16KHZ_R1-1249850209-4096.gwf L1:/home/lroy02/acceleration_runs/separate_runs/GW190814/L-L1_GWOSC_16KHZ_R1-1249850209-4096.gwf V1:/home/lroy02/acceleration_runs/separate_runs/GW190814/V-V1_GWOSC_16KHZ_R1-1249850209-4096.gwf

