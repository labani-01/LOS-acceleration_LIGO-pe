[variable_params]
mchirp = 
q =  
spin1_a = 
spin1_azimuthal = 
spin1_polar = 
spin2_a = 
spin2_azimuthal = 
spin2_polar =  
inclination =  
tc = 
ra = 
dec = 
coa_phase =
polarization =
distance = 
acc = 
lambda2 = 

[static_params]
approximant = constlosAcc 
base_model = IMRPhenomNSBH
v0 = 0
f_lower = 20
f_ref = 20
trigger_time = 1263097407.7
n = 0.1
taper = TAPER_NONE
tw = 0.08

[prior-mchirp]
name = mchirp_from_uniform_mass1_mass2
min-mchirp = 2.5
max-mchirp = 2.7

[prior-q]
name = q_from_uniform_mass1_mass2
min-q = 1
max-q = 19

[constraint-1]
name = custom
inputs = mchirp, q
constraint_arg = mass2_from_mchirp_q(mchirp,q) < 2.7

[prior-spin1_a]
name = uniform
min-spin1_a = 0
max-spin1_a = 0.99

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = 0
max-spin2_a = 0.1

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

[waveform_transforms-spin1x_ignored+spin1y_ignored+spin1z]
name = spherical_to_cartesian
x = spin1x_ignored
y = spin1y_ignored
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x_ignored+spin2y_ignored+spin2z]
name = spherical_to_cartesian
x = spin2x_ignored
y = spin2y_ignored
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal

[prior-lambda2]
name = uniform
min-lambda2 = 0
max-lambda2 = 5000

[waveform_transforms-mass1]
name = custom
inputs = mchirp, q
mass1 = mass1_from_mchirp_q(mchirp, q)

[waveform_transforms-mass2]
name = custom
inputs = mchirp, q
mass2 = mass2_from_mchirp_q(mchirp, q)

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle

[prior-tc]
#; coalescence time prior
name = uniform
min-tc = 1263097407.5
max-tc = 1263097407.8

[prior-distance]
#; following gives a uniform in volume
name = uniform_radius
min-distance = 25
max-distance = 1100

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[prior-coa_phase]
name = uniform_angle

[prior-acc]
name = uniform
min-acc = -0.05
max-acc = 0.05

[model]
name = marginalized_time
low-frequency-cutoff = 20
sample_rate = 4096

marginalize_vector_params = tc, ra, dec, polarization
marginalize_vector_samples = 20000

marginalize_phase = True
marginalize_distance = True
marginalize_distance_param = distance
marginalize_distance_interpolator = True
marginalize_distance_snr_range = 1, 50
marginalize_distance_density = 100, 100
marginalize_distance_samples = 10000

[sampler]
name = dynesty
dlogz = 0.1
nlive = 5000
nact = 50
walks = 700
maxmcmc = 10000
sample = rwalk
checkpoint_time_interval = 1800

[data]
instruments = H1 L1 V1
trigger-time = 1263097407.7
analysis-start-time = -120
analysis-end-time = 10
psd-estimation = median-mean
psd-start-time = -256
psd-end-time = 256
psd-inverse-length = 8
psd-segment-length = 8
psd-segment-stride = 4
frame-files = H1:/home/lroy02/acceleration_runs/separate_runs/GW200115/H-H1_GWOSC_4KHZ_R1-1263095360-4096.gwf L1:/home/lroy02/acceleration_runs/separate_runs/GW200115/L-L1_GWOSC_4KHZ_R1-1263095360-4096.gwf V1:/home/lroy02/acceleration_runs/separate_runs/GW200115/V-V1_GWOSC_4KHZ_R1-1263095360-4096.gwf
channel-name = H1:GWOSC-4KHZ_R1_STRAIN L1:GWOSC-4KHZ_R1_STRAIN V1:GWOSC-4KHZ_R1_STRAIN
sample-rate = 4096
strain-high-pass = 15
pad-data = 8
