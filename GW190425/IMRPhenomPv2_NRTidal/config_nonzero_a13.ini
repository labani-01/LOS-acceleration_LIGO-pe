[variable_params]
mchirp = 
q = 
spin1_a = 
spin1_azimuthal = 
spin1_polar = 
spin2_a = 
spin2_azimuthal = 
spin2_polar = 
inclination =
tc =
coa_phase =
polarization =
distance =
lambda1 = 
lambda2 = 
ra = 
dec = 
acc = 

[static_params]
approximant = constlosAcc
base_model = IMRPhenomPv2_NRTidal
f_lower = 20
f_ref = 20
trigger_time = 1240215503.0
v0 = 0
n = 0.1
taper = TAPER_NONE
tw = 0.08

[prior-mchirp]
name = mchirp_from_uniform_mass1_mass2
min-mchirp = 1.0
max-mchirp = 1.8

[prior-q]
name = q_from_uniform_mass1_mass2
min-q = 1
max-q = 3.0

[prior-spin1_a]
name = uniform
min-spin1_a = -0.05
max-spin1_a = 0.05

[prior-spin1_polar+spin1_azimuthal]
name = uniform_solidangle
polar-angle = spin1_polar
azimuthal-angle = spin1_azimuthal

[prior-spin2_a]
name = uniform
min-spin2_a = -0.05
max-spin2_a = 0.05

[prior-spin2_polar+spin2_azimuthal]
name = uniform_solidangle
polar-angle = spin2_polar
azimuthal-angle = spin2_azimuthal

[waveform_transforms-spin1x_ignored+spin1y_ignored+spin1z]
name = spherical_to_cartesian
x = spin1x_ignored
y = spin1y_ignored
z = spin1z
radial = spin1_a
polar = spin1_polar
azimuthal = spin1_azimuthal

[waveform_transforms-spin2x_ignored+spin2y_ignored+spin2z]
name = spherical_to_cartesian
x = spin2x_ignored
y = spin2y_ignored
z = spin2z
radial = spin2_a
polar = spin2_polar
azimuthal = spin2_azimuthal

[prior-tc]
#; coalescence time prior
name = uniform
min-tc = 1240215502.8
max-tc = 1240215503.2

[prior-distance]
#; following gives a uniform in volume
name = uniform_radius
min-distance = 50
max-distance = 300

[prior-polarization]
name = uniform_angle

[prior-inclination]
name = sin_angle

[prior-coa_phase]
name = uniform_angle

[prior-ra]
name = uniform_angle

[prior-dec]
name = cos_angle

[prior-lambda1]
name = uniform
min-lambda1 = 0
max-lambda1 = 5000

[prior-lambda2]
name = uniform
min-lambda2 = 0
max-lambda2 = 9000

[prior-acc]
name = uniform
min-acc = -0.001
max-acc = +0.001

[waveform_transforms-mass1]
name = custom
inputs = mchirp, q
mass1 = mass1_from_mchirp_q(mchirp, q)

[waveform_transforms-mass2]
name = custom
inputs = mchirp, q
mass2 = mass2_from_mchirp_q(mchirp, q)

[model]
name = marginalized_time
low-frequency-cutoff = 20.0
sample_rate = 4096
#check-for-valid-times =
#shift-psd-times-to-valid =
ignore-failed-waveforms =

marginalize_vector_params = ra, dec, tc, polarization
marginalize_vector_samples = 20000

marginalize_phase = True
marginalize_distance = True
marginalize_distance_param = distance
marginalize_distance_interpolator = True
marginalize_distance_snr_range = 5, 50
marginalize_distance_density = 100, 100
marginalize_distance_samples = 5000

[sampler]
name = dynesty
dlogz = 0.1
nlive = 16000
checkpoint_time_interval = 1800
#sample = rwalk
#walks = 25

[data]
instruments = L1 V1
trigger-time = 1240215503.0
analysis-start-time = -1090
analysis-end-time = 15
psd-estimation = median-mean
psd-start-time = -2000
psd-end-time = 100
psd-segment-length = 16
psd-segment-stride = 8
psd-inverse-length = 16
sample-rate = 4096
strain-high-pass = 15
pad-data = 8
frame-files = L1:/home/lroy02/acceleration_runs/separate_runs/GW190425/L-L1_GWOSC_4KHZ_R1-1240213455-4096.gwf V1:/home/lroy02/acceleration_runs/separate_runs/GW190425/V-V1_GWOSC_4KHZ_R1-1240213455-4096.gwf
channel-name = L1:GWOSC-4KHZ_R1_STRAIN V1:GWOSC-4KHZ_R1_STRAIN

